# baseline recipe to generate MATS verification plots/slides.
#   sfc_dieoff:  t2m, td2m, wind10m, rmse+bias
#   sfc_tseries: t2m, td2m, wind10m, rmse+bias, f000, f001, f012
#   RAOB_dieoff:   T, RHobT, Wind, rmse+bias
#   RAOB_profile:  T, RHobT, Wind, rmse+bias, f000, f001, f003, f006, f012, f024
#   RAOB_tseries:  T, RHobT, Wind, rmse+bias, f000, f001, f003, f006, f012, f024
#   AMDAR_dieoff:   T, RHobT, Wind, rmse+bias
#   AMDAR_profile:  T, RHobT, Wind, rmse+bias, f000, f001, f003, f006, f012, f024
#   AMDAR_tseries:  T, RHobT, Wind, rmse+bias, f000, f001, f003, f006, f012, f024
#   radar_dieoff:      cref, csi+freq, threshold15, treshold25, threshold35, threshold45
#   ceiling_dieoff:    csi+freq, treshold500, threshold1000, threshold3000, threshold6000
#   visibility_dieoff: csi+freq, treshold1, threshold3, threshold5, threshold10
#   graphics: CREF_full

experiments:
- MATS name: RRFSv2_conus_3km_ret_v2x_retv4
  short name: base4
  color: red
  COMROOT: gaeac6:/gpfs/f6/bil-fire10-oar/world-shared/jjh/rrfsv2/RRFSv2X/L60/OPSROOT/RRFSv2X.retv4/com/rrfs/v2.1.4
- MATS name: RRFSv2_conus_3km_ret_v2x_retv5
  short name: base5
  color: blue
  COMROOT: /gpfs/f6/bil-fire10-oar/world-shared/jjh/rrfsv2/RRFSv2X/L60/OPSROOT/RRFSv2.retv5/com/rrfs/v2.1.4
- MATS name: HRRR_OPS
  short name: HRRR
  color: orange
#- MATS name: RRFS_A
#  short name: RRFSA
#  color: "#5F5F5F"

pygraf graphics slides:
  enable: true
  recipe: graphics_slides_layout2_May2024.yaml

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# detailed recipes
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
common:
  #start and end dates are optional, if not specificed, use the first exp date range
  #start: "2024-05-06T10:00:00Z"
  #end: "2024-05-13T00:00:00Z"
  line weight: 3
  marker weight: 8
  #description font size: 24
  #legend font size: 28

automation:
  inter-plot waiting seconds: 3 
  control waiting seconds: 0.3  # pesudo "mouse click" intervals, 300ms 
  #base_url: "https://gsl.noaa.gov/int-mats"  # When the official MATS is down

# ======================================= plot groups  =============================================
plots:
- name: sfc_dieoff
  application: "Surface (METAR)"
  truth: "METAR"
  plot_type: dieoff
  region: "All HRRR domain"
  variable: [t2m, td2m, wind10m]
  statistic: [rmse+bias]

- name: sfc_tseries
  application: "Surface (METAR)"
  truth: "METAR"
  plot_type: "time series"
  region: "All HRRR domain"
  variable: [t2m, td2m, wind10m]
  statistic: [rmse+bias]
  forecast lead time: [0, 1, 12, 24]
  #Difference curves: "Diff all curves against the 1st added curve"

- name: ROAB_dieoff
  application: "Upper Air"
  plot_type: dieoff
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  Valid UTC Hour: [allz, 0z, 12z]
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]

- name: ROAB_profile
  application: "Upper Air"
  plot_type: profile
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  Valid UTC Hour: [allz, 0z, 12z]
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]
  forecast lead time: [0, 1, 3, 6, 12, 24]

- name: ROAB_tseries
  application: "Upper Air"
  plot_type: "time series"
  truth: "RAOBs (Traditional)"
  region: "HRRR domain"
  matched_samples: true
  variable: [T, RHobT, Wind]
  statistic: [rmse+bias]
  forecast lead time: [0, 1, 3, 6, 12, 24]

