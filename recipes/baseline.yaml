- name: radar_dieoff
  #exclude experiment: [HRRR_OPS]
  application: "Radar (MRMS)"
  plot_type: "die off"
  region: "Continental US"
  matched_samples: true
  variable: ["Composite Reflectivity"]
  Threshold: [15, 25, 35, 45]
  statistic: [CSI+Bias]
  #Difference curves: "Diff all curves against the 1st added curve"

- name: ceiling_dieoff
  application: "Ceiling and Visibility"
  plot_type: "die off"
  region: "All HRRR domain"
  matched_samples: true
  variable: ["ceiling"]
  Threshold: [500, 1000, 3000, 6000]
  statistic: [CSI+BIAS]
  #Difference curves: "Diff all curves against the 1st added curve"

- name: visibility_dieoff
  application: "Ceiling and Visibility"
  plot_type: "die off"
  region: "All HRRR domain"
  matched_samples: true
  variable: ["visibility"]
  Threshold: [1, 3, 5, 10]
  statistic: [CSI+ BIAS]
  #Difference curves: "Diff all curves against the 1st added curve"


# ======================================= MATS slides  =============================================
slides:
# -----  surface slides ------
- plot group: sfc_dieoff
  title: Surface Dieoff
  number of rows: 2
  row1: [t2m, td2m]
  row2: [wind10m]

- plot group: sfc_tseries
  title: T2M Time Series RMSE+BIAS
  number of rows: 2
  row1: [f000, f001]
  row2: [f012, f024]

- plot group: sfc_tseries
  title: Td2M Time Series RMSE+BIAS
  number of rows: 2
  row1: [f000, f001]
  row2: [f012, f024]

- plot group: sfc_tseries
